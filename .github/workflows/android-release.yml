name: Build Signed APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, example: v0.7.11-alpha"
        required: true
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew clean :app:assembleRelease --no-daemon

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Find and sign APK
        run: |
          set -euo pipefail

          mkdir -p dist

          echo "Searching APK files..."
          find . -type f -name "*.apk"

          APK_PATH="$(find . -type f -name "*.apk" | head -n 1)"
          test -n "$APK_PATH"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"

          "$ZIPALIGN" -p -f 4 "$APK_PATH" "dist/Callisto-${RELEASE_TAG}-aligned.apk"

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "dist/Callisto-${RELEASE_TAG}-signed.apk" \
            "dist/Callisto-${RELEASE_TAG}-aligned.apk"

          "$APKSIGNER" verify --verbose "dist/Callisto-${RELEASE_TAG}-signed.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Callisto-signed-apk
          path: dist/*-signed.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*-signed.apk
